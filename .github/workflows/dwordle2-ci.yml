name: DWORDle 2 CI

on:
  push:
    branches: [master]
    paths:
      - "DWORDle2/**"
      - ".github/workflows/dwordle2-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "DWORDle2/**"
      - ".github/workflows/dwordle2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwordle2-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: DWORDle2

jobs:
  test:
    name: Unit, UI, and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DWORDle2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all tests
        run: npm test
