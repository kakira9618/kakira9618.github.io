name: DWORDle 2 CI

on:
  push:
    branches: [master]
    paths:
      - "DWORDle2/**"
      - ".github/workflows/dwordle2-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "DWORDle2/**"
      - ".github/workflows/dwordle2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwordle2-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: DWORDle2

jobs:
  test:
    name: Unit, UI, and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # 浅いクローンだと js/version.js のハッシュ（過去のコミットを指す）を
          # 検証できず ui-smoke が落ちるので、履歴をすべて取る
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DWORDle2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all tests
        run: npm test

  dist:
    name: Built output smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # 浅いクローンだと js/version.js のハッシュ（過去のコミットを指す）を
          # 検証できず ui-smoke が落ちるので、履歴をすべて取る
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DWORDle2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 公開されるのは minify 済みの dist なので、そちらでも UI が動くことを確認する
      - name: Build and smoke-test the built output
        run: npm run test:dist
