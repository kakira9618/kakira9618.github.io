<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DWORDle 2 OGP (square icon)</title>
<style>
  /* 1200x1200 の正方形アイコン（X の Summary カード用。twitter:image が参照する）。
     tools/make-og.mjs がスクリーンショットして og-square.png に保存する。
     favicon.png / icon-512.png と同じ意匠を大きいキャンバスで描き直したもので、
     配色は原作 Wordle 準拠のクラシック配色（js/config.js の UI.tileColors.classic と同じ）。
     ベタ塗りなので PNG が最も小さくなる（写真的な og.html は JPEG で書き出す）。

     ジオメトリ・書体は favicon.png のラスタ実測から逆算した値をそのまま入れてある:
       - 帯とキャップの太さは一辺の 6.25%（favicon.png 実測: 16/256）
       - D / 2 のインク位置は favicon.png と一致（D: 左18% 上20.7% 幅49.2% 高55.9%、
         2: 左68.4% 上4.7% 幅19.9% 高24.2%）
       - 書体は Futura 700。favicon.png のグリフ縦横比（D 0.880 / 2 0.822）と
         一致する唯一の候補で、macOS 標準搭載。別 OS で再生成すると別の字面になるので注意。
     left / top は「文字のインク位置」ではなく CSS ボックス位置なので、
     Futura のサイドベアリング分だけずれた値になっている（触るなら再計測すること）。 */
  :root {
    --correct: #6aaa64; /* 地の緑 */
    --used: #c9b458;    /* L 字の帯 */
    --unused: #787c7e;  /* 帯の両端のキャップ */
    --unit: 6.25%;      /* 帯とキャップの太さ */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 1200px;
    overflow: hidden;
    position: relative;
    background: var(--correct);
    font-family: Futura, "Avenir Next", "Helvetica Neue", Helvetica, sans-serif;
  }

  /* L 字の帯（右辺 + 下辺）。両端はキャップの分だけ空ける */
  .bar {
    position: absolute;
    background: var(--used);
  }
  .bar.right { top: var(--unit); right: 0; bottom: 0; width: var(--unit); }
  .bar.bottom { left: var(--unit); right: 0; bottom: 0; height: var(--unit); }

  /* 帯の両端のキャップ */
  .cap {
    position: absolute;
    width: var(--unit);
    height: var(--unit);
    background: var(--unused);
  }
  .cap.tr { top: 0; right: 0; }
  .cap.bl { left: 0; bottom: 0; }

  /* 白い D²。D と 2 は独立に配置する（肩付き文字の位置を favicon と揃えるため） */
  .glyph {
    position: absolute;
    color: #fff;
    font-weight: 700;
    line-height: 1;
    white-space: pre;
  }
  .glyph.d { left: 145.7px; top: 128.3px; font-size: 890px; }
  .glyph.two { left: 809.9px; top: 13.3px; font-size: 375px; }
</style>
</head>
<body>
  <div class="bar right"></div>
  <div class="bar bottom"></div>
  <div class="cap tr"></div>
  <div class="cap bl"></div>
  <div class="glyph d">D</div>
  <div class="glyph two">2</div>
</body>
</html>
